name: V2 browser preview and mobile tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install container prerequisites
        run: apt-get update && apt-get install -y git curl ca-certificates python3
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real browser checks and capture previews
        run: node scripts/browser-check.mjs
      - name: Upload desktop and mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioguard-v2-browser-preview
          path: previews/
          if-no-files-found: ignore

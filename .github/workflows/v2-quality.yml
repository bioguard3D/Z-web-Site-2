name: BIOGUARD 3D V2 quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v2-design-contact]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check static pages, links and sitemap
        run: node scripts/check-site.mjs
